
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <style>
    :root{
      --bg:#000;
      --card:#1c1c1c;
      --muted:#222;
      --primary:#ff9800;
      --success:#4caf50;
      --text:#fff;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Poppins',sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
    }
 
    .main-box{
      width:100%;
      max-width:1000px;
      background:#24242473;
      border:px solid var(--primary);
      border-radius:20px;
      padding:28px;
      box-shadow:0 8px 25px rgba(0,0,0,.45);
    }
 
    #heading h2{
      text-align:center;
      margin-bottom:20px;
      color:var(--primary);
      letter-spacing:.3px;
      font-weight:600;
    }
 
    .inputer{margin-bottom:20px}
    #e-a{
      display:block;
      margin-bottom:6px;
      font-weight:600;
      color:var(--primary);
      font-size:.95rem;
    }
    .inputer input{
      width:100%;
      padding:12px 14px;
      border:none;
      outline:none;
      border-radius:10px;
      background:#333;
      color:#fff;
      font-size:16px;
    }
 
    .changer{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:20px;
      margin:22px 0 20px;
      flex-wrap:nowrap;
    }
    .c1,.c3{
      flex:1;
      min-width:220px;
    }
    #same{
      display:inline-block;
      margin-bottom:6px;
      font-weight:600;
      color:var(--primary);
      font-size:.95rem;
    }
    select{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:none;
      outline:none;
      background:#333;
      color:#fff;
      font-size:16px;
      appearance:none;
      background-image:linear-gradient(45deg,transparent 50%, var(--primary) 50%),linear-gradient(135deg, var(--primary) 50%,transparent 50%);
      background-position:calc(100% - 18px) calc(50% - 4px), calc(100% - 12px) calc(50% - 4px);
      background-size:6px 6px, 6px 6px;
      background-repeat:no-repeat;
    }
    .icon{
      display:flex;
      align-items:center;
      justify-content:center;
      width:56px;
      height:56px;
      border-radius:12px;
      border:1px solid var(--primary);
      color:var(--primary);
      font-size:22px;
      flex:0 0 56px;
    }
    .icon:hover{
        background-color: #ff9800;
        color: black;
    }
 
    .output{
      text-align:center;
      padding:12px;
      background:var(--muted);
      border-radius:10px;
      margin-bottom:18px;
      font-weight:600;
      color:var(--success);
      font-size:15px;
    }
 
    .last-btn{margin-top:6px}
    .btn{
      width:100%;
      padding:14px;
      border:none;
      background:var(--primary);
      color:#000;
      font-size:1rem;
      font-weight:700;
      border-radius:10px;
      cursor:pointer;
      transition:transform .12s ease, filter .2s ease;
    }
    .btn:hover{filter:brightness(1.05)}
    .btn:active{transform:scale(.98)}
 
    @media (max-width: 900px){
      .main-box{padding:22px}
      .c1,.c3{min-width:180px}
    }
    @media (max-width: 680px){
      .changer{
        flex-direction:column;
        gap:14px;
      }
      .icon{
        width:48px;height:48px;font-size:20px;border-radius:10px;
      }
      .output{font-size:14px}
    }
  </style>

 <div class="main-box">
  <div id="heading">
    <h2>Currency Converter</h2>
  </div>

  <div class="inputer">
    <span id="e-a">Enter Amount</span>
    <input id="input" type="number" placeholder="Enter value" />
  </div>

  <div class="changer">
    <div class="c1">
      <span id="same">From</span>
      <select class="languages-from" id="from">
        <!-- JS se fill hoga -->
      </select>
    </div>

    <div class="icon" title="Swap">
      <i class="fa-solid fa-arrow-right-arrow-left"></i>
    </div>

    <div class="c3">
      <span id="same">To</span>
      <select class="languages-to" id="to">
        <!-- JS se fill hoga -->
      </select>
    </div>
  </div>

  <div class="output" id="rate">Enter Value to Convert</div>

  <div class="last-btn">
    <button class="btn" type="button">
      Convert <i class="fa-solid fa-arrow-right-arrow-left" style="margin-left:6px"></i>
    </button>
  </div>
</div>


<script>
  const countryList = {
    AED: "AE", AFN: "AF", XCD: "AG", ALL: "AL", AMD: "AM", ANG: "AN", AOA: "AO",
    AQD: "AQ", ARS: "AR", AUD: "AU", AZN: "AZ", BAM: "BA", BBD: "BB", BDT: "BD",
    XOF: "BE", BGN: "BG", BHD: "BH", BIF: "BI", BMD: "BM", BND: "BN", BOB: "BO",
    BRL: "BR", BSD: "BS", NOK: "BV", BWP: "BW", BYR: "BY", BZD: "BZ", CAD: "CA",
    CDF: "CD", XAF: "CF", CHF: "CH", CLP: "CL", CNY: "CN", COP: "CO", CRC: "CR",
    CUP: "CU", CVE: "CV", CYP: "CY", CZK: "CZ", DJF: "DJ", DKK: "DK", DOP: "DO",
    DZD: "DZ", ECS: "EC", EEK: "EE", EGP: "EG", ETB: "ET", EUR: "FR", FJD: "FJ",
    FKP: "FK", GBP: "GB", GEL: "GE", GGP: "GG", GHS: "GH", GIP: "GI", GMD: "GM",
    GNF: "GN", GTQ: "GT", GYD: "GY", HKD: "HK", HNL: "HN", HRK: "HR", HTG: "HT",
    HUF: "HU", IDR: "ID", ILS: "IL", INR: "IN", IQD: "IQ", IRR: "IR", ISK: "IS",
    JMD: "JM", JOD: "JO", JPY: "JP", KES: "KE", KGS: "KG", KHR: "KH", KMF: "KM",
    KPW: "KP", KRW: "KR", KWD: "KW", KYD: "KY", KZT: "KZ", LAK: "LA", LBP: "LB",
    LKR: "LK", LRD: "LR", LSL: "LS", LTL: "LT", LVL: "LV", LYD: "LY", MAD: "MA",
    MDL: "MD", MGA: "MG", MKD: "MK", MMK: "MM", MNT: "MN", MOP: "MO", MRO: "MR",
    MTL: "MT", MUR: "MU", MVR: "MV", MWK: "MW", MXN: "MX", MYR: "MY", MZN: "MZ",
    NAD: "NA", XPF: "NC", NGN: "NG", NIO: "NI", NPR: "NP", NZD: "NZ", OMR: "OM",
    PAB: "PA", PEN: "PE", PGK: "PG", PHP: "PH", PKR: "PK", PLN: "PL", PYG: "PY",
    QAR: "QA", RON: "RO", RSD: "RS", RUB: "RU", RWF: "RW", SAR: "SA", SBD: "SB",
    SCR: "SC", SDG: "SD", SEK: "SE", SGD: "SG", SKK: "SK", SLL: "SL", SOS: "SO",
    SRD: "SR", STD: "ST", SVC: "SV", SYP: "SY", SZL: "SZ", THB: "TH", TJS: "TJ",
    TMT: "TM", TND: "TN", TOP: "TO", TRY: "TR", TTD: "TT", TWD: "TW", TZS: "TZ",
    UAH: "UA", UGX: "UG", USD: "US", UYU: "UY", UZS: "UZ", VEF: "VE", VND: "VN",
    VUV: "VU", YER: "YE", ZAR: "ZA", ZMK: "ZM", ZWD: "ZW",
  };

  // Populate both dropdowns
  const fromSelect = document.getElementById("from");
  const toSelect = document.getElementById("to");

  for (let currency in countryList) {
    let option1 = document.createElement("option");
    option1.value = currency;
    option1.textContent = `${currency} - ${countryList[currency]}`;
    fromSelect.appendChild(option1);

    let option2 = document.createElement("option");
    option2.value = currency;
    option2.textContent = `${currency} - ${countryList[currency]}`;
    toSelect.appendChild(option2);
  }

  // Default selection (optional)
  fromSelect.value = "USD";
  toSelect.value = "PKR";
</script>

<script src="./converter.js"></script>
