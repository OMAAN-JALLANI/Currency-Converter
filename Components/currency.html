
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <style>
    :root{
      --bg:#000;
      --card:#1c1c1c;
      --muted:#222;
      --primary:#ff9800;
      --success:#4caf50;
      --text:#fff;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Poppins',sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
    }
 
    .main-box{
      width:100%;
      max-width:1000px;
      background:#24242473;
      border:px solid var(--primary);
      border-radius:20px;
      padding:28px;
      box-shadow:0 8px 25px rgba(0,0,0,.45);
    }
 
    #heading h2{
      text-align:center;
      margin-bottom:20px;
      color:var(--primary);
      letter-spacing:.3px;
      font-weight:600;
    }
 
    .inputer{margin-bottom:20px}
    #e-a{
      display:block;
      margin-bottom:6px;
      font-weight:600;
      color:var(--primary);
      font-size:.95rem;
    }
    .inputer input{
      width:100%;
      padding:12px 14px;
      border:none;
      outline:none;
      border-radius:10px;
      background:#333;
      color:#fff;
      font-size:16px;
    }
 
    .changer{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:20px;
      margin:22px 0 20px;
      flex-wrap:nowrap;
    }
    .c1,.c3{
      flex:1;
      min-width:220px;
    }
    #same{
      display:inline-block;
      margin-bottom:6px;
      font-weight:600;
      color:var(--primary);
      font-size:.95rem;
    }
    select{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:none;
      outline:none;
      background:#333;
      color:#fff;
      font-size:16px;
      appearance:none;
      background-image:linear-gradient(45deg,transparent 50%, var(--primary) 50%),linear-gradient(135deg, var(--primary) 50%,transparent 50%);
      background-position:calc(100% - 18px) calc(50% - 4px), calc(100% - 12px) calc(50% - 4px);
      background-size:6px 6px, 6px 6px;
      background-repeat:no-repeat;
    }
    .icon{
      display:flex;
      align-items:center;
      justify-content:center;
      width:56px;
      height:56px;
      border-radius:12px;
      border:1px solid var(--primary);
      color:var(--primary);
      font-size:22px;
      flex:0 0 56px;
    }
    .icon:hover{
        background-color: #ff9800;
        color: black;
    }
 
    .output{
      text-align:center;
      padding:12px;
      background:var(--muted);
      border-radius:10px;
      margin-bottom:18px;
      font-weight:600;
      color:var(--success);
      font-size:15px;
    }
 
    .last-btn{margin-top:6px}
    .btn{
      width:100%;
      padding:14px;
      border:none;
      background:var(--primary);
      color:#000;
      font-size:1rem;
      font-weight:700;
      border-radius:10px;
      cursor:pointer;
      transition:transform .12s ease, filter .2s ease;
    }
    .btn:hover{filter:brightness(1.05)}
    .btn:active{transform:scale(.98)}
 
    @media (max-width: 900px){
      .main-box{padding:22px}
      .c1,.c3{min-width:180px}
    }
    @media (max-width: 680px){
      .changer{
        flex-direction:column;
        gap:14px;
      }
      .icon{
        width:48px;height:48px;font-size:20px;border-radius:10px;
      }
      .output{font-size:14px}
    }
  </style>
 

 
  <div class="main-box">
    <div id="heading">
      <h2>Currency Converter</h2>
    </div>

    <div class="inputer">
      <span id="e-a">Enter Amount</span>
      <input id="input" type="number" value="1" placeholder="Enter value" />
    </div>

    <div class="changer">
      <div class="c1">
        <span id="same">From</span>
        <select id="from"></select>
      </div>

      <div class="icon" title="Swap" id="swapBtn">
        <i class="fa-solid fa-arrow-right-arrow-left"></i>
      </div>

      <div class="c3">
        <span id="same">To</span>
        <select id="to"></select>
      </div>
    </div>

    <div class="output" id="rate">1 USD = 283.79 PKR</div>

    <div class="last-btn">
      <button class="btn" type="button" id="convertBtn">
        Convert <i class="fa-solid fa-arrow-right-arrow-left" style="margin-left:6px"></i>
      </button>
    </div>
  </div>

<script>
   const countryList = {
    AED: "United Arab Emirates", AFN: "Afghanistan", XCD: "Antigua and Barbuda",
    ALL: "Albania", AMD: "Armenia", ANG: "Netherlands Antilles", AOA: "Angola",
    AQD: "Antarctica", ARS: "Argentina", AUD: "Australia", AZN: "Azerbaijan",
    BAM: "Bosnia and Herzegovina", BBD: "Barbados", BDT: "Bangladesh",
    XOF: "Benin", BGN: "Bulgaria", BHD: "Bahrain", BIF: "Burundi", BMD: "Bermuda",
    BND: "Brunei", BOB: "Bolivia", BRL: "Brazil", BSD: "Bahamas", NOK: "Norway",
    BWP: "Botswana", BYR: "Belarus", BZD: "Belize", CAD: "Canada",
    CDF: "Democratic Republic of the Congo", XAF: "Central African Republic",
    CHF: "Switzerland", CLP: "Chile", CNY: "China", COP: "Colombia",
    CRC: "Costa Rica", CUP: "Cuba", CVE: "Cape Verde", CYP: "Cyprus",
    CZK: "Czech Republic", DJF: "Djibouti", DKK: "Denmark",
    DOP: "Dominican Republic", DZD: "Algeria", ECS: "Ecuador", EEK: "Estonia",
    EGP: "Egypt", ETB: "Ethiopia", EUR: "European Union", FJD: "Fiji",
    FKP: "Falkland Islands", GBP: "United Kingdom", GEL: "Georgia", GGP: "Guernsey",
    GHS: "Ghana", GIP: "Gibraltar", GMD: "Gambia", GNF: "Guinea",
    GTQ: "Guatemala", GYD: "Guyana", HKD: "Hong Kong", HNL: "Honduras",
    HRK: "Croatia", HTG: "Haiti", HUF: "Hungary", IDR: "Indonesia",
    ILS: "Israel", INR: "India", IQD: "Iraq", IRR: "Iran", ISK: "Iceland",
    JMD: "Jamaica", JOD: "Jordan", JPY: "Japan", KES: "Kenya",
    KGS: "Kyrgyzstan", KHR: "Cambodia", KMF: "Comoros", KPW: "North Korea",
    KRW: "South Korea", KWD: "Kuwait", KYD: "Cayman Islands", KZT: "Kazakhstan",
    LAK: "Laos", LBP: "Lebanon", LKR: "Sri Lanka", LRD: "Liberia",
    LSL: "Lesotho", LTL: "Lithuania", LVL: "Latvia", LYD: "Libya",
    MAD: "Morocco", MDL: "Moldova", MGA: "Madagascar", MKD: "North Macedonia",
    MMK: "Myanmar", MNT: "Mongolia", MOP: "Macau", MRO: "Mauritania",
    MTL: "Malta", MUR: "Mauritius", MVR: "Maldives", MWK: "Malawi",
    MXN: "Mexico", MYR: "Malaysia", MZN: "Mozambique", NAD: "Namibia",
    XPF: "New Caledonia", NGN: "Nigeria", NIO: "Nicaragua", NPR: "Nepal",
    NZD: "New Zealand", OMR: "Oman", PAB: "Panama", PEN: "Peru",
    PGK: "Papua New Guinea", PHP: "Philippines", PKR: "Pakistan",
    PLN: "Poland", PYG: "Paraguay", QAR: "Qatar", RON: "Romania",
    RSD: "Serbia", RUB: "Russia", RWF: "Rwanda", SAR: "Saudi Arabia",
    SBD: "Solomon Islands", SCR: "Seychelles", SDG: "Sudan",
    SEK: "Sweden", SGD: "Singapore", SKK: "Slovakia", SLL: "Sierra Leone",
    SOS: "Somalia", SRD: "Suriname", STD: "São Tomé and Príncipe",
    SVC: "El Salvador", SYP: "Syria", SZL: "Eswatini", THB: "Thailand",
    TJS: "Tajikistan", TMT: "Turkmenistan", TND: "Tunisia", TOP: "Tonga",
    TRY: "Turkey", TTD: "Trinidad and Tobago", TWD: "Taiwan",
    TZS: "Tanzania", UAH: "Ukraine", UGX: "Uganda", USD: "United States",
    UYU: "Uruguay", UZS: "Uzbekistan", VEF: "Venezuela", VND: "Vietnam",
    VUV: "Vanuatu", YER: "Yemen", ZAR: "South Africa", ZMK: "Zambia",
    ZWD: "Zimbabwe",
  };
  const base_URL = "https://api.exchangerate-api.com/v4/latest";

  let output = document.querySelector(".output");
  let fromSelect = document.getElementById("from");
  let toSelect = document.getElementById("to");
  let amountInput = document.getElementById("input");
  let convertBtn = document.getElementById("convertBtn");
  let swapBtn = document.getElementById("swapBtn");

  // Populate dropdowns
  for (let currency in countryList) {
    let option1 = document.createElement("option");
    option1.value = currency;
    option1.innerText = ` ${countryList[currency]}`;

    let option2 = option1.cloneNode(true);

    fromSelect.appendChild(option1);
    toSelect.appendChild(option2);
  }

  // Default values
  fromSelect.value = "USD";
  toSelect.value = "PKR";

  // Swap functionality
  swapBtn.addEventListener("click", () => {
    let temp = fromSelect.value;
    fromSelect.value = toSelect.value;
    toSelect.value = temp;
  });

  // Convert button click
  convertBtn.addEventListener("click", async () => {
    let amtVal = amountInput.value;

    if (amtVal === "" || amtVal <= 0) {
      amtVal = 1;
      amountInput.value = 1;
    }

    let fromCurrency = fromSelect.value;
    let toCurrency = toSelect.value;

    let URL = `${base_URL}/${fromCurrency}`;
    try {
      let response = await fetch(URL);
      let data = await response.json();

      if (!data.rates[toCurrency]) {
        output.innerText = "Currency not available!";
        output.style.color = "red";
        return;
      }

      let rate = data.rates[toCurrency];
      let convertedAmount = (amtVal * rate).toFixed(2);

      output.innerText = `${amtVal} ${fromCurrency} = ${convertedAmount} ${toCurrency}`;
      output.style.color = "green";
    } catch (error) {
      console.error(error);
      output.innerText = "Error fetching data!";
      output.style.color = "red";
    }
  });
</script>
