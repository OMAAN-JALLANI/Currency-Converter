<link rel="stylesheet" href="./converter.css">
<style>
  body {
    font-family: "Poppins", sans-serif;
    background-color: black;
    color: rgba(255, 153, 0, 0.9);
    margin: 0;
    padding: 0;
  }

  /* Navbar */
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
    padding: 10px 30px;
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  .navbar .nav-logo img {
    height: 50px;
    border-radius: 8px;
  }

  .navbar .nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
  }

  .navbar .nav-links li a {
    text-decoration: none;
    color: #ff9800;
    font-weight: 500;
    transition: color 0.3s;
  }

  .navbar .nav-links li a:hover {
    color: white;
  }

  /* Section styling */
  .countries-section {
    background: rgba(54, 54, 54, 0.06);
    margin: 100px auto;
    border-radius: 12px;
    max-width: 800px;
    width: 100%;
    padding: 20px;
    color: #fff;
  }

  .countries-section h2 {
    text-align: center;
    color: #ff9800;
    margin-bottom: 20px;
  }

  /* Country List */
  #countryList {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }

  #countryList li {
    background: rgba(255, 255, 255, 0.08);
    padding: 10px 15px;
    margin: 6px 0;
    border-radius: 8px;
    transition: background 0.3s;
  }

  #countryList li:hover {
    background: rgba(255, 153, 0, 0.2);
  }

  /* Scroll for long country list */
  .countries-section ul {
    max-height: 400px;
    overflow-y: auto;
  }

  /* Search bar */
  .search {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  .search input {
    width: 60%;
    padding: 12px;
    border-radius: 4px 0 0 4px;
    border: none;
    outline: none;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
  }

  .search button {
    cursor: pointer;
    padding: 12px 16px;
    border-radius: 0 4px 4px 0;
    border: none;
    font-size: 16px;
    background: #ff9800;
    color: black;
    font-weight: bold;
    transition: 0.3s;
  }

  .search button:hover {
    background: #ff9901a1;
    color: #000000;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .navbar {
      flex-direction: column;
      align-items: flex-start;
    }

    .navbar .nav-links {
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .countries-section {
      margin: 40px 15px;
    }

    .search input {
      width: 100%;
    }
  }
</style>

<nav class="navbar">
  <div class="nav-logo">
    <img class="log" src="./currencyX.jpg" alt="currencyX">
  </div>
  <ul class="nav-links">
    <li><a href="../index.html" class="nav-btn">Home</a></li>
    <li><a href="./Country.html" class="nav-btn">Countries</a></li>
    <li><a href="./Blog.html" class="nav-btn">Blog</a></li>
    <li><a href="./Contact.html" class="nav-btn">Contact</a></li>
  </ul>
</nav>

<section class="countries-section">
  <h2>Country List</h2>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Country...">
    <button id="searchBtn" style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Search</button>
  </div>
  <ul id="countryList"></ul>
  <p style="text-align:center; margin-top:10px;">Total Countries: <strong id="totalCountries"></strong></p>
</section>

<script>
  const countryList = {
    AED: "United Arab Emirates", AFN: "Afghanistan", XCD: "Antigua and Barbuda",
    ALL: "Albania", AMD: "Armenia", ANG: "Netherlands Antilles", AOA: "Angola",
    AQD: "Antarctica", ARS: "Argentina", AUD: "Australia", AZN: "Azerbaijan",
    BAM: "Bosnia and Herzegovina", BBD: "Barbados", BDT: "Bangladesh",
    XOF: "Benin", BGN: "Bulgaria", BHD: "Bahrain", BIF: "Burundi", BMD: "Bermuda",
    BND: "Brunei", BOB: "Bolivia", BRL: "Brazil", BSD: "Bahamas", NOK: "Norway",
    BWP: "Botswana", BYR: "Belarus", BZD: "Belize", CAD: "Canada",
    CDF: "Democratic Republic of the Congo", XAF: "Central African Republic",
    CHF: "Switzerland", CLP: "Chile", CNY: "China", COP: "Colombia",
    CRC: "Costa Rica", CUP: "Cuba", CVE: "Cape Verde", CYP: "Cyprus",
    CZK: "Czech Republic", DJF: "Djibouti", DKK: "Denmark",
    DOP: "Dominican Republic", DZD: "Algeria", ECS: "Ecuador", EEK: "Estonia",
    EGP: "Egypt", ETB: "Ethiopia", EUR: "European Union", FJD: "Fiji",
    FKP: "Falkland Islands", GBP: "United Kingdom", GEL: "Georgia", GGP: "Guernsey",
    GHS: "Ghana", GIP: "Gibraltar", GMD: "Gambia", GNF: "Guinea",
    GTQ: "Guatemala", GYD: "Guyana", HKD: "Hong Kong", HNL: "Honduras",
    HRK: "Croatia", HTG: "Haiti", HUF: "Hungary", IDR: "Indonesia",
    ILS: "Israel", INR: "India", IQD: "Iraq", IRR: "Iran", ISK: "Iceland",
    JMD: "Jamaica", JOD: "Jordan", JPY: "Japan", KES: "Kenya",
    KGS: "Kyrgyzstan", KHR: "Cambodia", KMF: "Comoros", KPW: "North Korea",
    KRW: "South Korea", KWD: "Kuwait", KYD: "Cayman Islands", KZT: "Kazakhstan",
    LAK: "Laos", LBP: "Lebanon", LKR: "Sri Lanka", LRD: "Liberia",
    LSL: "Lesotho", LTL: "Lithuania", LVL: "Latvia", LYD: "Libya",
    MAD: "Morocco", MDL: "Moldova", MGA: "Madagascar", MKD: "North Macedonia",
    MMK: "Myanmar", MNT: "Mongolia", MOP: "Macau", MRO: "Mauritania",
    MTL: "Malta", MUR: "Mauritius", MVR: "Maldives", MWK: "Malawi",
    MXN: "Mexico", MYR: "Malaysia", MZN: "Mozambique", NAD: "Namibia",
    XPF: "New Caledonia", NGN: "Nigeria", NIO: "Nicaragua", NPR: "Nepal",
    NZD: "New Zealand", OMR: "Oman", PAB: "Panama", PEN: "Peru",
    PGK: "Papua New Guinea", PHP: "Philippines", PKR: "Pakistan",
    PLN: "Poland", PYG: "Paraguay", QAR: "Qatar", RON: "Romania",
    RSD: "Serbia", RUB: "Russia", RWF: "Rwanda", SAR: "Saudi Arabia",
    SBD: "Solomon Islands", SCR: "Seychelles", SDG: "Sudan",
    SEK: "Sweden", SGD: "Singapore", SKK: "Slovakia", SLL: "Sierra Leone",
    SOS: "Somalia", SRD: "Suriname", STD: "São Tomé and Príncipe",
    SVC: "El Salvador", SYP: "Syria", SZL: "Eswatini", THB: "Thailand",
    TJS: "Tajikistan", TMT: "Turkmenistan", TND: "Tunisia", TOP: "Tonga",
    TRY: "Turkey", TTD: "Trinidad and Tobago", TWD: "Taiwan",
    TZS: "Tanzania", UAH: "Ukraine", UGX: "Uganda", USD: "United States",
    UYU: "Uruguay", UZS: "Uzbekistan", VEF: "Venezuela", VND: "Vietnam",
    VUV: "Vanuatu", YER: "Yemen", ZAR: "South Africa", ZMK: "Zambia",
    ZWD: "Zimbabwe",
  };

  const ul = document.getElementById("countryList");
  const total = document.getElementById("totalCountries");
  const searchInput = document.getElementById("searchInput");
  const searchBtn = document.getElementById("searchBtn");

  function displayCountries(filter = "") {
    ul.innerHTML = "";
    let count = 0;
    for (const [code, country] of Object.entries(countryList)) {
      if (
        country.toLowerCase().includes(filter.toLowerCase()) ||
        code.toLowerCase().includes(filter.toLowerCase())
      ) {
        const li = document.createElement("li");
        li.textContent = `${code} - ${country}`;
        ul.appendChild(li);
        count++;
      }
    }
    total.textContent = count;
  }

  displayCountries();

  searchBtn.addEventListener("click", () => {
    displayCountries(searchInput.value);
  });

  searchInput.addEventListener("keyup", () => {
    displayCountries(searchInput.value);
  });
</script>
